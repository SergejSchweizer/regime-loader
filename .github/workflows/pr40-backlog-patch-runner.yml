name: pr40-backlog-patch-runner

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-backlog:
    if: github.head_ref == 'pr-40/postgres-temporal-conformance-plan' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr-40/postgres-temporal-conformance-plan
          fetch-depth: 0
      - name: Execute staged patch and clean temporary files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/pr40-backlog-patch.yml').read_text(encoding='utf-8')
          start = source.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = source.index("\n          PY\n", start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, '<pr40-backlog-patch>', 'exec'), {'__name__': '__main__'})
          PY
          rm -f .github/workflows/pr40-backlog-patch.yml
          rm -f .github/workflows/pr40-backlog-patch-runner.yml
          rm -f .pr40-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(pr-40): expand repository audit corrective backlog"
          git push origin HEAD:pr-40/postgres-temporal-conformance-plan
